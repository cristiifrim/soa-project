<div class="detail-ad-page">
  @if (ad) {
    <article class="detail-card card">
      <header class="detail-header">
        <span class="detail-category">{{ ad.category }}</span>
        <h1 class="detail-title">{{ ad.title }}</h1>
        <div class="detail-meta">
          <span class="detail-meta-item">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            </svg>
            {{ ad.location || 'Not specified' }}
          </span>
          <span class="detail-meta-item">Posted {{ ad.created_at | date: 'mediumDate' }}</span>
        </div>
      </header>

      <div class="detail-body">
        <section class="detail-section">
          <h3 class="detail-section-title">Description</h3>
          <p class="detail-description">{{ ad.description }}</p>
        </section>
        <section class="detail-section detail-dates">
          <p class="text-sm text-slate-500">Last updated: {{ ad.updated_at | date: 'short' }}</p>
        </section>
      </div>
    </article>

    <section class="chat-section card">
      <h2 class="chat-section-title">
        <svg class="chat-section-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
        Discussion
      </h2>
      <app-chat [adId]="ad.id" [userConnected]="userConnected"></app-chat>
    </section>
  }
</div>
