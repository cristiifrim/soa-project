<div class="list-ad-page">
  <header class="list-header">
    <h2 class="list-title">List of Ads</h2>
    <button type="button" class="btn btn-primary" (click)="goToAddAd()">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add an Ad
    </button>
  </header>

  <div class="list-grid">
    @for (ad of listAds; track ad) {
      <ng-mf-line-ad [ad]="ad" [userConnected]="userConnected"></ng-mf-line-ad>
    }
  </div>

  @if (listAds && listAds.length === 0) {
    <div class="empty-state">
      <div class="empty-icon">
        <svg class="w-16 h-16 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      </div>
      <p class="empty-title">No ads yet</p>
      <p class="empty-desc">Be the first to post an ad.</p>
      <button type="button" class="btn btn-primary mt-4" (click)="goToAddAd()">Add an Ad</button>
    </div>
  }
</div>
