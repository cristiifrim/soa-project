<header class="topbar">
  <div class="topbar-inner">
    <!-- Logo -->
    <a routerLink="/list-ad" class="logo-link">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
          <path d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c.966 0 1.89.166 2.75.47a.75.75 0 0 0 1-.708V4.262a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
        </svg>
      </div>
      <span class="logo-text">Ad Tracker</span>
    </a>

    @if (isUserConnected()) {
      <div class="topbar-actions">
        <!-- Notifications -->
        <div class="notifications-wrapper">
          <button type="button" class="btn btn-ghost icon-btn" (click)="toggleNotifications()" aria-label="Notifications">
            <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 3.908-3.43 2 2 0 0 0-2.827-2.827 21.382 21.382 0 0 1-3.405 3.057M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14V11a6 6 0 0 0-4-5.659V4a2 2 0 1 0-4 0v1.341C7 7 6 8 6 11v3c0 .386-.146.735-.405 1.005L4 17h5m6 0v1a3 3 0 0 1-6 0v-1m6 0H9" />
            </svg>
            @if (notifications.length > 0) {
              <span class="notification-badge">{{ notifications.length }}</span>
            }
          </button>

          <div [ngClass]="{'dropdown-open': showNotifications}" class="notifications-dropdown">
            <app-notifications></app-notifications>
          </div>
        </div>

        <button type="button" class="btn btn-danger" (click)="logout()">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Logout
        </button>
      </div>
    }
  </div>
</header>
